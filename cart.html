    <style>
        body { background-color: #FAF7F0; }
        .cart-page { max-width: 900px; margin: 2.5rem auto; padding: 0 1rem 5rem; }
        .cart-page-title { font-family: var(--font-serif); font-size: 1.8rem; margin-bottom: 1.75rem; color: var(--primary-color); }
        .cart-layout { display: grid; grid-template-columns: 1fr 320px; gap: 2rem; align-items: start; }
        @media (max-width: 700px) { .cart-layout { grid-template-columns: 1fr; } }

        /* Cart items panel */
        .cart-items-panel { background: #fff; border-radius: 14px; box-shadow: 0 2px 16px rgba(0,0,0,.06); overflow: hidden; }
        .cart-item { display: flex; gap: 1rem; align-items: flex-start; padding: 1rem 1.25rem; border-bottom: 1px solid var(--border-color); }
        .cart-item:last-child { border-bottom: none; }
        .cart-item img { width: 72px; height: 72px; object-fit: contain; background: var(--bg-color); border-radius: 8px; flex-shrink: 0; }
        .cart-item-info { flex: 1; }
        .cart-item-name { font-weight: 600; font-size: .95rem; margin-bottom: .2rem; color: var(--text-main); }
        .cart-item-meta { font-size: .8rem; color: var(--text-muted); margin-bottom: .5rem; }
        .qty-row { display: flex; align-items: center; gap: .5rem; margin-top: .4rem; }
        .qty-btn { width: 28px; height: 28px; border: 1px solid var(--border-color); border-radius: 6px; background: var(--bg-color); cursor: pointer; font-size: 1rem; display: flex; align-items: center; justify-content: center; transition: background .15s, color .15s; }
        .qty-btn:hover { background: var(--primary-color); color: #fff; border-color: var(--primary-color); }
        .qty-val { min-width: 28px; text-align: center; font-weight: 600; font-size: .9rem; }
        .line-price { font-weight: 700; color: var(--primary-color); font-size: .9rem; margin-left: .5rem; }
        .remove-item-btn { margin-left: auto; background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 1.1rem; padding: .3rem; transition: color .15s; flex-shrink: 0; }
        .remove-item-btn:hover { color: #c0392b; }

        /* Summary panel */
        .cart-summary { background: #fff; border-radius: 14px; box-shadow: 0 2px 16px rgba(0,0,0,.06); padding: 1.5rem; position: sticky; top: 100px; }
        .cart-summary h3 { font-size: 1rem; font-weight: 700; margin-bottom: 1rem; border-bottom: 1px solid var(--border-color); padding-bottom: .75rem; color: var(--text-main); }
        .summary-row { display: flex; justify-content: space-between; font-size: .9rem; margin-bottom: .5rem; color: var(--text-muted); }
        .summary-row.total-row { font-weight: 700; font-size: 1.05rem; color: var(--text-main); border-top: 1px solid var(--border-color); padding-top: .75rem; margin-top: .5rem; }
        .checkout-cta { display: block; width: 100%; margin-top: 1.25rem; text-align: center; padding: .9rem; font-size: 1rem; font-weight: 600; background: var(--primary-color); color: #fff; border: none; border-radius: 10px; cursor: pointer; text-decoration: none; transition: background .2s; letter-spacing: .02em; }
        .checkout-cta:hover { background: var(--primary-hover); color: #fff; }
        .continue-link { display: block; text-align: center; margin-top: .75rem; font-size: .85rem; color: var(--text-muted); text-decoration: none; transition: color .15s; }
        .continue-link:hover { color: var(--primary-color); }

        /* Empty state */
        .cart-empty { text-align: center; padding: 5rem 1rem; }
        .cart-empty ion-icon { font-size: 4rem; color: var(--border-color); display: block; margin: 0 auto 1rem; }
        .cart-empty p { color: var(--text-muted); margin-bottom: 1.5rem; font-size: .95rem; }
    </style>

<body>
    <header class="header">
        <div class="container nav-container">
            <a href="index.html" class="logo"><img src="product pictures/main logo white.webp" alt="Zahroun"></a>
            <nav class="nav-links" id="nav-links">
                <a href="index.html">Home</a>
                <a href="shop.html">Shop</a>
                <a href="about.html">About Us</a>
                <a href="contact.html">Contact</a>
            </nav>
            <div class="nav-icons">
                <button aria-label="Search"><ion-icon name="search-outline"></ion-icon></button>
                <button aria-label="Cart" id="cart-icon">
                    <ion-icon name="bag-outline"></ion-icon>
                    <span class="cart-count" id="cart-count">0</span>
                </button>
                <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Menu">
                    <ion-icon name="menu-outline"></ion-icon>
                </button>
            </div>
        </div>
    </header>

    <div class="cart-page">
        <h1 class="cart-page-title">Your Cart</h1>
        <div id="cart-page-content"></div>
    </div>

    <!-- Sidebar cart modal (same as all pages) -->
    <div id="cart-modal" style="display: none; position: fixed; top: 0; right: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 100000;">
        <div style="position: absolute; top: 0; right: 0; width: 400px; max-width: 100%; height: 100%; background: white; padding: 2rem; display: flex; flex-direction: column; box-shadow: -5px 0 15px rgba(0,0,0,0.1); transform: translateX(100%); transition: transform 0.3s;" id="cart-content-wrapper">
            <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 1rem; margin-bottom: 1rem;">
                <h3>Your Cart</h3>
                <button id="close-cart" style="background: none; border: none; font-size: 1.5rem; cursor: pointer;"><ion-icon name="close-outline"></ion-icon></button>
            </div>
            <div id="cart-items" style="flex: 1; overflow-y: auto;"></div>
            <div style="border-top: 1px solid var(--border-color); padding-top: 1rem; margin-top: 1rem;">
                <div style="display: flex; justify-content: space-between; margin-bottom: 1rem; font-weight: 600; font-size: 1.2rem;">
                    <span>Subtotal</span>
                    <span id="cart-total">Tk 0</span>
                </div>
                <button class="btn" style="width: 100%;" onclick="window.location.href='checkout.html'">Checkout</button>
            </div>
        </div>
    </div>

    <script type="module" src="js/store.js"></script>
    <script type="module" src="js/promotions.js"></script>
    <script src="js/pricing.js"></script>
    <script defer src="js/cart.js"></script>
    <script defer src="js/ui.js"></script>
    <script>
    /* Declared (not an IIFE-scoped expression) so the freshness listeners at the
       bottom of this script can call it again once settings and live product
       data arrive. */
    function renderCartPage() {
        const wrap = document.getElementById("cart-page-content");
        if (!wrap) return;
        const cartData = JSON.parse(localStorage.getItem("zahroun_cart") || "[]");

        function esc(s) {
            return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
        }

        function saveAndRender(newCart) {
            localStorage.setItem("zahroun_cart", JSON.stringify(newCart));
            // Every promotion is a function of the cart's contents and
            // quantities (tier and seasonal scale with subtotal; BXGY, BOGO and
            // min-qty scale with item count), so a result cached from the
            // previous cart is wrong the moment a line is changed or removed.
            // Drop it first so the summary can never show a discount this cart
            // has not earned — with Buy-2-Get-1 on three bottles, keeping it
            // after deleting two priced the whole order at the delivery fee —
            // then re-evaluate and render again with the real figure.
            window._cartPromoResult = null;
            renderCartPage();
            if (window.zahRefreshCartPromos) window.zahRefreshCartPromos();
        }

        if (!cartData.length) {
            wrap.innerHTML = `<div class="cart-empty">
                <ion-icon name="bag-outline"></ion-icon>
                <p>Your cart is empty.</p>
                <a href="shop.html" class="btn">Browse Fragrance Collection</a>
            </div>`;
            return;
        }

        /* Canonical pricing — the same function checkout and the order writer
           use. This page used to hard-code `delivery = subtotal >= 5000 ? 0 : 70`,
           which ignored the admin's configured delivery charge and free-delivery
           threshold entirely: it quoted Tk 70 where checkout charged Tk 60, and
           advertised "add Tk X more for free delivery" against a Tk 5,000 bar
           that did not exist in settings. */
        const settings = window.ZahrounPricing.getStoreSettings();
        const summary = window.ZahrounPricing.computeOrderSummary({
            cart: cartData,
            promoResult: window._cartPromoResult || null
            // No coupon or loyalty here — both are entered at checkout, so they
            // can only ever REDUCE this figure. deliveryFee is omitted, which
            // uses the Inside-Dhaka rate: the same default checkout's area
            // selector starts on, so the two totals agree on arrival.
        });
        const subtotal = summary.subtotal;
        const delivery = summary.effectiveDelivery;
        const total = summary.total;
        const FREE_THRESHOLD = settings.freeDeliveryThreshold;
        const itemCount = cartData.reduce((s, i) => s + (i.quantity || 1), 0);

        wrap.innerHTML = `
        <div class="cart-layout">
            <div class="cart-items-panel">
                ${cartData.map((item, idx) => {
                    const price = parseFloat(item.selectedPrice) || item.price || 0;
                    const lineTotal = price * (item.quantity || 1);
                    const regPrice = item.flashSalePrice && item.prices ? (item.prices[item.size] || item.prices['50ML'] || 0) : 0;
                    const isSale = regPrice && price < regPrice;
                    const priceMeta = isSale
                        ? `<span style="text-decoration:line-through;color:#aaa;font-size:.78rem;margin-right:.25rem;">Tk ${regPrice.toLocaleString()}</span><span style="color:#c0392b;font-weight:600;">Tk ${price.toLocaleString()}</span> each`
                        : `Tk ${price.toLocaleString()} each`;
                    return `<div class="cart-item">
                        <img src="${esc(item.image)}" alt="${esc(item.name)}" loading="lazy">
                        <div class="cart-item-info">
                            <div class="cart-item-name">${esc(item.name)}</div>
                            <div class="cart-item-meta">${esc(item.size || "50ML")} &middot; ${priceMeta}</div>
                            <div class="qty-row">
                                <button class="qty-btn" data-action="dec" data-idx="${idx}"><ion-icon name="remove-outline"></ion-icon></button>
                                <span class="qty-val">${item.quantity || 1}</span>
                                <button class="qty-btn" data-action="inc" data-idx="${idx}"><ion-icon name="add-outline"></ion-icon></button>
                                <span class="line-price">Tk ${lineTotal.toLocaleString()}</span>
                            </div>
                        </div>
                        <button class="remove-item-btn" data-action="remove" data-idx="${idx}" title="Remove item">
                            <ion-icon name="trash-outline"></ion-icon>
                        </button>
                    </div>`;
                }).join("")}
            </div>
            <div class="cart-summary">
                <h3>Order Summary</h3>
                <div class="summary-row">
                    <span>Subtotal (${itemCount} item${itemCount !== 1 ? "s" : ""})</span>
                    <span>Tk ${subtotal.toLocaleString()}</span>
                </div>
                ${summary.promoDiscount > 0 ? `<div class="summary-row" style="color:#163E34;font-weight:600;">
                    <span>Promotions</span>
                    <span>-Tk ${summary.promoDiscount.toLocaleString()}</span>
                </div>` : ""}
                <div class="summary-row">
                    <span>Delivery <span style="font-size:.72rem;color:var(--text-muted);font-weight:400;">(inside Dhaka)</span></span>
                    <span>${delivery === 0 ? '<span style="color:#1e7e34;font-weight:600;">Free</span>' : "Tk " + delivery.toLocaleString()}</span>
                </div>
                ${FREE_THRESHOLD > 0 && subtotal < FREE_THRESHOLD ? `<div style="font-size:.75rem;color:var(--text-muted);margin-bottom:.4rem;">Add Tk ${(FREE_THRESHOLD - subtotal).toLocaleString()} more for free delivery</div>` : ""}
                <div class="summary-row total-row">
                    <span>Total</span>
                    <span>Tk ${total.toLocaleString()}</span>
                </div>
                <button class="checkout-cta" onclick="checkBxgyAndProceed()">Proceed to Checkout</button>
                <a href="shop.html" class="continue-link">&larr; Continue Shopping</a>
            </div>
        </div>`;

        wrap.querySelectorAll("[data-action]").forEach(btn => {
            btn.addEventListener("click", () => {
                const idx = parseInt(btn.dataset.idx);
                const action = btn.dataset.action;
                const freshCart = JSON.parse(localStorage.getItem("zahroun_cart") || "[]");
                if (action === "inc") {
                    freshCart[idx].quantity = (freshCart[idx].quantity || 1) + 1;
                    saveAndRender(freshCart);
                } else if (action === "dec") {
                    freshCart[idx].quantity = (freshCart[idx].quantity || 1) - 1;
                    if (freshCart[idx].quantity <= 0) freshCart.splice(idx, 1);
                    saveAndRender(freshCart);
                } else if (action === "remove") {
                    freshCart.splice(idx, 1);
                    saveAndRender(freshCart);
                }
            });
        });
    }
    renderCartPage();

    /* This page renders synchronously from localStorage, before store settings,
       live product data and the flash-sale document have loaded. Without these
       listeners it kept whatever it drew first — showing dead flash-sale prices
       after a sale ended, and a delivery figure computed from defaults rather
       than the shop's real settings. js/cart.js reconcileCart() rewrites the
       stored cart on products-ready / flashsale-status; re-rendering afterwards
       is what makes this page agree with checkout. */
    (function keepCartPageFresh() {
        // Deferred one tick on purpose. js/cart.js also listens to
        // products-ready / flashsale-status and re-prices the stored cart
        // (reconcileCart) — but it is a deferred script, so its listener is
        // registered AFTER this one and runs second. Rendering synchronously
        // here painted the stale localStorage prices first: with an expired
        // flash sale, a first (cold-cache) visit showed the old sale total on
        // this page while checkout showed the real one. setTimeout lets every
        // listener for the event finish before the page is drawn.
        const rerender = () => setTimeout(() => {
            const wrap = document.getElementById("cart-page-content");
            if (wrap && typeof renderCartPage === "function") renderCartPage();
        }, 0);
        document.addEventListener("products-ready", rerender);
        document.addEventListener("flashsale-status", rerender);
        window.addEventListener("promos-updated", rerender);

        // Evaluate promotions with the same engine checkout uses, so any
        // automatic discount is reflected here too rather than appearing for the
        // first time on the checkout screen.
        const evaluateCartPromos = async () => {
            try {
                const cartData = JSON.parse(localStorage.getItem("zahroun_cart") || "[]");
                if (!cartData.length || !window.ZahrounPromos) return;
                window._cartPromoResult = await window.ZahrounPromos.evaluate(cartData, {});
                rerender();
            } catch { /* promos are additive here; a failure just shows no promo line */ }
        };
        document.addEventListener("products-ready", evaluateCartPromos);
        window.addEventListener("promos-updated", evaluateCartPromos);
        // A sale ending re-prices every line, and promo tiers keyed off subtotal
        // move with it — so the promo result needs recomputing here too, not
        // just the item rows.
        document.addEventListener("flashsale-status", evaluateCartPromos);
        // renderCartPage() is a top-level declaration outside this IIFE, so its
        // quantity/remove handlers cannot see this const. Publish it so an edit
        // to the cart can recompute the promotions it just invalidated.
        window.zahRefreshCartPromos = evaluateCartPromos;
        if (window.ZahrounPromos && window.ZahrounPromos.ready) {
            window.ZahrounPromos.ready.then(evaluateCartPromos).catch(() => {});
        }
    })();
    </script>
    <script defer src="/_vercel/speed-insights/script.js"></script>
</body>
</html>
